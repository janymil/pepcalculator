# The WhatsApp side of dose reminders: Evolution API with its own Postgres and
# Redis, every port bound to loopback.
#
#   cp .env.whatsapp.example .env   # then edit it — the secrets are required
#   docker compose -f docker-compose.whatsapp.yml up -d
#
# Read `PROPOSAL-whatsapp-reminders.md` before starting this. Evolution runs an
# **unofficial** WhatsApp client: the number can be banned with no appeal and no
# way back. Web Push stays the default channel for exactly that reason.
#
# Nothing here is published to the internet. `127.0.0.1:` is deliberate: the
# reverse proxy exposes the webhook and nothing else.
#
# ## Never use `--remove-orphans` with this file
#
# This file and `docker-compose.yml` share the project name `pepcalculator`, so
# each sees the other's containers as orphans. `docker compose up -d` alone warns
# and leaves them alone; adding `--remove-orphans` would delete the **sync
# server** and its running reminders.
#
# Two things must be checked against the running instance, not against this file:
#   - the **image tag**, which is pinned on purpose so a protocol change cannot
#     arrive unannounced. Bump it deliberately, then re-scan the QR code.
#   - the **send path**, which has differed between v1 and v2. The sync server's
#     `WHATSAPP_SEND_PATH` is what adapts to it.
services:
  evolution:
    # The project's own registry name and its newest **stable** tag.
    #
    # `atendai/evolution-api` — the name in most tutorials, including the
    # original plan for this feature — no longer resolves; Docker Hub answers
    # "object not found". The project moved to `evoapicloud/evolution-api`.
    #
    # Pinned to a release, not `latest`: `latest` currently points at a 2.4.0
    # release candidate, and a protocol change should never arrive unannounced.
    # Bump it deliberately, then re-scan the QR code.
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    networks: [whatsapp]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      # --- the API itself ---
      SERVER_URL: http://127.0.0.1:8080
      # This is the value the sync server calls `WHATSAPP_API_KEY`.
      AUTHENTICATION_API_KEY: ${WHATSAPP_API_KEY:?set WHATSAPP_API_KEY in .env}
      # --- storage ---
      DATABASE_ENABLED: 'true'
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/evolution?schema=public
      DATABASE_SAVE_DATA_INSTANCE: 'true'
      # We keep the inbound messages ourselves (the `inbound` table) and nothing
      # else, so the gateway's own history is switched off. Less to leak.
      DATABASE_SAVE_DATA_NEW_MESSAGE: 'false'
      DATABASE_SAVE_MESSAGE_UPDATE: 'false'
      DATABASE_SAVE_DATA_CONTACTS: 'false'
      DATABASE_SAVE_DATA_CHATS: 'false'
      # --- cache ---
      CACHE_REDIS_ENABLED: 'true'
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: 'false'
      CACHE_LOCAL_ENABLED: 'false'
      # --- the webhook, straight at the sync server ---
      #
      # The secret is written **once**, as `WHATSAPP_WEBHOOK_SECRET`, and this URL
      # is built from it — so the path here and the sync server's own copy can
      # never drift apart. The address is the sync server by name on the shared
      # docker network, which keeps the webhook off the public internet entirely:
      # no route to guess, no TLS to terminate, and the secret is a second lock
      # rather than the only one.
      #
      # If the sync server lives elsewhere, set `WEBHOOK_URL` in `.env` instead.
      WEBHOOK_GLOBAL_ENABLED: 'true'
      WEBHOOK_GLOBAL_URL: ${WEBHOOK_URL:-http://sync:8787/api/wa/webhook/${WHATSAPP_WEBHOOK_SECRET:?set WHATSAPP_WEBHOOK_SECRET in .env}}
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: 'false'
      WEBHOOK_EVENTS_MESSAGES_UPSERT: 'true'
      WEBHOOK_EVENTS_MESSAGES_UPDATE: 'true'
      # `connection.update` is how a dropped link is noticed. Without it, the
      # reminders stop silently and nothing says so.
      WEBHOOK_EVENTS_CONNECTION_UPDATE: 'true'
      # Everything else is noise, and each enabled event is another webhook call.
      WEBHOOK_EVENTS_SEND_MESSAGE: 'false'
      WEBHOOK_EVENTS_APPLICATION_STARTUP: 'false'
      WEBHOOK_EVENTS_QRCODE_UPDATED: 'false'
      LOG_LEVEL: ERROR,WARN,INFO
      DEL_INSTANCE: 'false'
    volumes:
      # This volume is the linked WhatsApp session. Lose it and the QR code has
      # to be scanned again.
      - evolution-instances:/evolution/instances

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [whatsapp]
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: evolution
    volumes:
      - evolution-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U evolution -d evolution']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [whatsapp]
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - evolution-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  evolution-instances:
  evolution-postgres:
  evolution-redis:

# A fixed name, declared in both compose files, so the two *do* share one
# network. Without `name:` each file would create its own project-prefixed
# network and the sync server could never reach Evolution.
networks:
  whatsapp:
    name: pepstool-whatsapp

